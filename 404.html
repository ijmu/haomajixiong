<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="robots" content="noindex">
<title>页面不存在 · 号码玄机</title>
<style>
  :root{--bg:#0b0a10;--gold:#d9b877;--gold2:#f4e0b0;--txt:#ece7dd;--dim:#9b93a8;--dim2:#6f6779;--line:#2c2537}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:32px 22px}
  .wrap{max-width:420px;text-align:center}
  .mark{font-size:52px;line-height:1;color:var(--gold);text-shadow:0 0 26px rgba(217,184,119,.5)}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:58px;font-weight:700;
    color:var(--gold2);letter-spacing:.06em;line-height:1;margin:18px 0 6px}
  h1{font-family:"Songti SC","STSong",serif;font-size:20px;font-weight:600;
    letter-spacing:.16em;margin:0 0 14px;color:var(--gold2)}
  p{margin:0 0 22px;font-size:13px;line-height:1.85;color:var(--dim)}
  a{display:inline-block;padding:13px 30px;border-radius:11px;text-decoration:none;
    background:linear-gradient(135deg,#e6c88a,var(--gold) 42%,#a9853f);color:#1c1508;
    font-family:"Songti SC","STSong",serif;font-size:15px;font-weight:700;letter-spacing:.18em;
    box-shadow:0 6px 22px rgba(217,184,119,.22)}
  .hint{margin-top:26px;font-size:11px;color:var(--dim2);letter-spacing:.06em}
</style>
</head>
<body>
  <div class="wrap">
    <div class="mark">☯︎</div>
    <div class="code">404</div>
    <h1>此卦无爻</h1>
    <p>你要找的页面不存在，或已被移走。<br>号码玄机只在本地推演，没有别的入口。</p>
    <a href="/">返回首页</a>
    <p class="hint">传统民俗数理 · 文化娱乐参考</p>
  </div>
</body>
</html>
